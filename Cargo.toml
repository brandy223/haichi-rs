[package]
name = "haichi-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "haichi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
derive_more = { version = "2", features = ["display", "from_str"] }
serde = { version = "1.0.229", features = ["derive"] }
shlex = "2.0.1"
thiserror = "2.0.20"
toml = "1.1.4"
zbus = { version = "5.19.0", features = ["blocking"] }
