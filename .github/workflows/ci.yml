name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44 # sync with FEDORA_VERSION in .devcontainer/Containerfile
    steps:
      - name: Install prerequisites
        run: dnf install -y git gcc curl tar gzip xz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44 # sync with FEDORA_VERSION in .devcontainer/Containerfile
    steps:
      - name: Install prerequisites
        run: dnf install -y git gcc curl tar gzip xz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44 # sync with FEDORA_VERSION in .devcontainer/Containerfile
    steps:
      - name: Install prerequisites
        run: dnf install -y git gcc curl tar gzip xz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --verbose --locked
      - run: cargo test --verbose --locked

  msrv:
    name: MSRV (1.87)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44 # sync with FEDORA_VERSION in .devcontainer/Containerfile
    steps:
      - name: Install prerequisites
        run: dnf install -y git gcc curl tar gzip xz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6a393d88d2772701bf30bc3fd30f9cffa24e5a08 # 1.87.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44 # sync with FEDORA_VERSION in .devcontainer/Containerfile
    steps:
      - name: Install prerequisites
        run: dnf install -y git gcc curl tar gzip xz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@c6e5a961001f7be56eec4766ed45de261826a205 # cargo-audit
      - run: cargo audit
