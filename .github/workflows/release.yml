name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: haichi
  TARGET: x86_64-unknown-linux-gnu

permissions:
  contents: read

jobs:
  check:
    name: Verify
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44 # sync with FEDORA_VERSION in .devcontainer/Containerfile
    steps:
      - name: Install prerequisites
        run: dnf install -y git gcc curl tar gzip xz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --verbose --locked

  build:
    name: Build release binary
    needs: check
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44 # sync with FEDORA_VERSION in .devcontainer/Containerfile
    steps:
      - name: Install prerequisites
        run: dnf install -y git gcc curl tar gzip xz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked
      - run: strip target/release/${{ env.BIN_NAME }}
      - name: Package archive
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          dist="${BIN_NAME}-${version}-${TARGET}"
          mkdir "$dist"
          cp "target/release/${BIN_NAME}" "$dist"/
          cp README.md LICENSE "$dist"/
          tar -czf "${dist}.tar.gz" "$dist"
          sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            ${{ env.BIN_NAME }}-*.tar.gz
            ${{ env.BIN_NAME }}-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ env.BIN_NAME }}-*.tar.gz
            ${{ env.BIN_NAME }}-*.tar.gz.sha256
          generate_release_notes: true
